name: Publish To npm

# Publishes with npm trusted publishing (GitHub Actions OIDC), so no npm token
# is stored anywhere. The one-time setup on npmjs.com is in docs/RELEASING.md.
#
# Runs when a GitHub release is published. It can also be started by hand for
# a release whose automatic publish failed: Actions > Publish To npm > Run
# workflow, with the release tag (for example v0.2.0).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing GitHub release to publish, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Verify the GitHub release exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease \
            --jq '"Publishing release " + .tagName + " (prerelease " + (.isPrerelease | tostring) + ")"'
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm client that supports trusted publishing (11.5.1 or newer)
        run: |
          npm install -g npm@latest
          npm --version
      - name: Verify release tag matches package version
        run: >-
          node --input-type=module -e
          "import pkg from './package.json' with { type: 'json' };
          if (process.env.RELEASE_TAG !== 'v' + pkg.version) {
          throw new Error('Release tag ' + process.env.RELEASE_TAG +
          ' does not match package version ' + pkg.version); }"
      - name: Check whether this version is already on npm
        id: published
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "reddial@${VERSION}" version >/dev/null 2>&1; then
            echo "reddial@${VERSION} is already on npm; skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.published.outputs.exists == 'false'
      - run: npm run typecheck
        if: steps.published.outputs.exists == 'false'
      - run: npm run typecheck:examples
        if: steps.published.outputs.exists == 'false'
      - run: npm test
        if: steps.published.outputs.exists == 'false'
      - run: npm run package:smoke
        if: steps.published.outputs.exists == 'false'
      - name: Publish with trusted publishing (provenance is attached automatically)
        if: steps.published.outputs.exists == 'false'
        run: npm publish --access public
